# ==============================================================
# HADDOCK3 global docking: SiiE (domains 50-53) vs glyco-MUC1
# No AIRs - unbiased sampling across full surface
# Run locally: haddock3 global_docking_siie_muc1.cfg
# ==============================================================

run_dir = "run_siie_muc1_global_2"
mode = "local"
ncores = 8         # adjust to your machine

molecules = [
    "pdbtools_cleaned_muc_sial.pdb",   # glycosylated 10-repeat MUC1, chain A
    "pdbtools_siie.pdb",           # SiiE domains 50-53 + Ca2+, chain B
]

# ==============================================================
# Topology
# ==============================================================
['topoaa.1']
autohis = true
autotoppar = true
hydrogen_build = "all"
delenph = true

# ==============================================================
# Rigid-body docking - global/unbiased (no ambig_fname)
# ==============================================================
['rigidbody.1']
sampling = 1000
w_vdw = 1.0
inter_rigid = 0.001
tolerance = 5

# ==============================================================
# Cluster after rigidbody using ilRMSD (no binding site needed)
# ==============================================================
['ilrmsdmatrix.1']

['clustrmsd.1']
criterion = "maxclust"
n_clusters = 10
min_population = 4

['seletop.1']
select = 50

# ==============================================================
# EM refinement of selected models
# ==============================================================
['emref.1']
tolerance = 5

# ==============================================================
# Final clustering and scoring
# ==============================================================
['ilrmsdmatrix.2']

['clustrmsd.2']
criterion = "maxclust"
n_clusters = 10
min_population = 4

['caprieval.1']
